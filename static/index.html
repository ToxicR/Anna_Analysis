<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anna Analysis</title>
  <link rel="icon" type="image/png" href="/static/assets/anna-logo.png">
  <link rel="stylesheet" href="/static/styles.css?v=20260520-no-flash">
  <style>
    #appScreen:not([hidden]) .app-shell {
      display: grid;
      grid-template-columns: 280px minmax(420px, 1fr);
      height: 100dvh;
      overflow: hidden;
    }
    #chatPanel[hidden],
    #newChatPanel[hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <section id="loginScreen" class="admin-login">
    <form id="loginForm" class="login-card" novalidate>
      <div class="login-brand">
        <img class="brand-mark" src="/static/assets/anna-logo.png" alt="Anna logo">
        <div>
          <h1>Anna Analysis</h1>
          <p>请使用管理员分配的账号登录</p>
        </div>
      </div>
      <label for="loginAccount">账号</label>
      <input id="loginAccount" name="account" autocomplete="username" placeholder="请输入账号" required>
      <label for="loginPassword">密码</label>
      <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
      <p id="loginError" class="login-error" hidden></p>
      <button id="loginSubmit" type="submit" class="primary full">登录</button>
    </form>
  </section>

  <div id="appScreen" hidden>
  <div id="appShell" class="app-shell has-main-panel">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-mark" src="/static/assets/anna-logo.png" alt="Anna logo">
        <div>
          <h1>Anna Analysis</h1>
          <p>代码与日志分析 Agent</p>
        </div>
      </div>

      <section class="side-section">
        <div class="section-title">会话</div>
        <div id="sessionSummary" class="session-summary">请选择或新建会话</div>
        <div class="session-actions">
          <button id="newChatSession" type="button" class="full primary">新建会话</button>
        </div>
        <div id="sidebarSessionList" class="sidebar-session-list"></div>
      </section>

      <section class="side-section side-user-bar">
        <span id="userAccountLabel" class="user-account-label"></span>
        <button id="logoutUser" type="button" class="full">退出登录</button>
      </section>

    </aside>

    <main id="newChatPanel" class="new-chat-landing">
      <div class="new-chat-center">
        <h2 id="newChatHeadline" class="new-chat-headline">想让我帮你分析些什么？</h2>

        <div id="newChatComposer" class="new-chat-composer">
          <div id="newAttachmentBar" class="attachment-bar new-chat-attachment-bar" hidden>
            <span data-attachment-name></span>
            <button id="newRemoveAttachment" type="button">移除</button>
          </div>

          <div class="new-chat-input-area">
            <textarea id="newQuestion" rows="3" placeholder="尽管问，可描述功能、问题现象，或粘贴日志片段"></textarea>
          </div>

          <div class="new-chat-toolbar">
            <div class="new-chat-toolbar-left">
              <button id="newAddAttachment" type="button" class="new-chat-icon-btn" title="添加附件" aria-label="添加附件">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
              </button>
              <label class="new-chat-project-pill">
                <svg class="new-chat-project-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/></svg>
                <select id="analysisProject" class="new-chat-select"></select>
              </label>
            </div>
            <div class="new-chat-toolbar-right">
              <label class="new-chat-select-pill new-chat-model-pill">
                <span class="new-chat-select-label">模型</span>
                <select id="analysisModel" class="new-chat-select new-chat-model-select"></select>
              </label>
              <button id="newRunAnalysis" type="button" class="new-chat-send" title="发送分析" aria-label="发送分析">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5m0 0l-6 6m6-6l6 6"/></svg>
              </button>
            </div>
          </div>

          <div class="new-chat-config-bar">
            <label class="new-chat-select-pill">
              <span class="new-chat-select-label">模式</span>
              <select id="outputMode" class="new-chat-select">
                <option value="non_developer" selected>非研发模式</option>
                <option value="developer">研发模式</option>
              </select>
            </label>
            <label class="new-chat-select-pill new-chat-scope-pill">
              <span class="new-chat-select-label">范围</span>
              <input id="analysisScope" type="text" placeholder="可选，如 android/ 支付模块">
            </label>
          </div>

          <div id="analysisRepos" class="new-chat-repos-hidden" hidden></div>
        </div>

        <section class="new-chat-suggestions">
          <div id="newQuestionTemplates" class="question-templates new-chat-templates" aria-label="快速提问模板"></div>
        </section>
        <div id="newAnalysisResult" class="new-chat-status">准备就绪</div>
      </div>
    </main>

    <main id="chatPanel" class="chat" hidden>
      <header class="chat-header">
        <div class="chat-header-main">
          <h2>分析对话</h2>
          <p id="chatProjectContext" class="chat-project-context">尚未创建会话</p>
        </div>
        <div class="chat-actions">
          <button id="clearChat" type="button">清空对话</button>
        </div>
      </header>

      <section id="chatMessages" class="chat-messages">
        <article class="message assistant">
          <img class="avatar ai-avatar" src="/static/assets/anna-logo.png" alt="Anna AI">
          <div class="bubble">
            <div class="message-meta">Anna Analysis</div>
            <div class="message-body">选择项目和仓库后，点击下方<strong>快速提问</strong>模板，把【括号内容】改成你的实际情况即可发送。也可直接输入问题，或上传日志/截图排查问题。</div>
          </div>
        </article>
      </section>

      <footer id="composer" class="composer">
        <div id="attachmentBar" class="attachment-bar" hidden>
          <span data-attachment-name></span>
          <button id="removeAttachment" type="button">移除</button>
        </div>
        <input id="logFile" type="file" multiple hidden>
        <div id="questionTemplates" class="question-templates" aria-label="快速提问模板"></div>
        <textarea id="question" rows="3" placeholder="输入问题，或点击上方模板快速开始。把【括号内容】改成你的实际情况。"></textarea>
        <div class="composer-actions">
          <div class="composer-left">
            <button id="addAttachment" type="button" class="icon-button" title="添加附件">+</button>
            <div id="analysisResult" class="status-text">准备就绪</div>
          </div>
          <button id="runAnalysis" class="primary">发送分析</button>
        </div>
      </footer>
    </main>

  </div>
  </div>

  <script src="/static/app.js?v=20260520-session-switch"></script>
</body>
</html>
